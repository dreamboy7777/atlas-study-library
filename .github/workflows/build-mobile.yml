name: Build mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "atlas.html"
      - ".github/workflows/build-mobile.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk downloads/atlas-android.apk
          ls -lh downloads/atlas-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-android-apk
          path: downloads/atlas-android.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iPhone IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -project Atlas.xcodeproj \
            -scheme Atlas \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Atlas.app Payload/
          mkdir -p ../../downloads
          rm -f ../../downloads/atlas-ios.ipa
          zip -qry ../../downloads/atlas-ios.ipa Payload
          ls -lh ../../downloads/atlas-ios.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ios-ipa
          path: downloads/atlas-ios.ipa
          if-no-files-found: error
          retention-days: 14
