<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Atlas — a local-first study library for medical students">
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1210"/>
      <stop offset="0.55" stop-color="#070a09"/>
      <stop offset="1" stop-color="#0a0f0d"/>
    </linearGradient>
    <linearGradient id="banner-mint" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#d7fff4"/>
      <stop offset="0.45" stop-color="#9ff0dd"/>
      <stop offset="1" stop-color="#5cc9b2"/>
    </linearGradient>
    <radialGradient id="banner-glow" cx="0.12" cy="0.1" r="0.85">
      <stop offset="0" stop-color="#9ff0dd" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#9ff0dd" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#9ff0dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-gold" cx="0.92" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#d8b98a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#d8b98a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#e9fff6" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="banner-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#banner-bg)"/>
  <rect width="1200" height="360" rx="30" fill="url(#banner-grid)"/>
  <rect width="1200" height="360" rx="30" fill="url(#banner-glow)"/>
  <rect width="1200" height="360" rx="30" fill="url(#banner-gold)"/>
  <rect x="1" y="1" width="1198" height="358" rx="29" fill="none" stroke="#e9fff6" stroke-opacity="0.10"/>

  <g transform="translate(64 58) scale(0.23828125)">
